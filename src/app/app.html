<header class="site-header">
  <a class="brand" routerLink="/login" aria-label="Angular Starter login">
    <span class="brand-mark">A</span>
    <span>Angular Starter</span>
  </a>

  <nav aria-label="Main navigation">
    @if (userEmail()) {
      <span class="current-user" title="{{ userEmail() }}">
        Signed in as <strong>{{ userEmail() }}</strong>
      </span>
      <button class="logout-button" type="button" (click)="logout()">Disconnect</button>
    }
    <a routerLink="/login" routerLinkActive="active">Login</a>
    <a routerLink="/register" routerLinkActive="active">Register</a>
    <a class="nav-cta" routerLink="/chatroom" routerLinkActive="active">Chat Room</a>
  </nav>
</header>

<router-outlet />

<footer>
  <a class="brand" routerLink="/login"><span class="brand-mark">A</span><span>Angular Starter</span></a>
  <p>Built as a starting point for the web.</p>
  <p>© 2026</p>
</footer>
